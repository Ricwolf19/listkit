name: 'Commitlint Check'
description: 'Validates commit messages using commitlint. Requires the repo to be already set up (Node, pnpm, dependencies installed).'

inputs:
  base-ref:
    description: 'Base ref to compare commits against (e.g. origin/main)'
    required: true
    default: 'origin/${{ github.base_ref }}'

runs:
  using: 'composite'
  steps:
    - name: Validate commit messages
      shell: bash
      run: pnpm exec commitlint --from=${{ inputs.base-ref }} --to=HEAD --verbose
