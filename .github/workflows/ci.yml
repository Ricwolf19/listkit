name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-repo
        with:
          cache: true

      - name: Lint
        run: pnpm lint

      - name: Secrets scan
        run: pnpm exec secretlint --secretlintignore .gitignore "**/*"

      - name: Build package
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      # mongo.parity.test.ts boots a real mongod (mongodb-memory-server); cache
      # the downloaded binary so tests don't re-download ~80 MB per run.
      - name: Cache mongod binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('packages/listkit/package.json') }}
          restore-keys: |
            mongodb-binaries-${{ runner.os }}-

      - name: Tests
        run: pnpm test

      - name: Unused code / deps (knip)
        run: pnpm knip

      - name: Architecture / circular deps (dependency-cruiser)
        run: pnpm depcruise

      - name: Bundle size budget
        run: pnpm --filter listkit size

      - name: Package publishability (publint)
        run: pnpm --filter listkit check:publish

      - name: Type emission correctness (attw)
        run: pnpm --filter listkit check:types
