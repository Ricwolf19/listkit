name: CI

on:
  pull_request:
    branches: [main, development]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup-repo
        with:
          fetch-depth: 0
          cache: true

      - name: Lint
        run: pnpm lint

      - name: Secrets scan
        run: pnpm exec secretlint --secretlintignore .gitignore "**/*"

      - name: Build package
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Unused code / deps (knip)
        run: pnpm knip

      - name: Architecture / circular deps (dependency-cruiser)
        run: pnpm depcruise

      - name: Bundle size budget
        run: pnpm --filter @pibytelabs/listkit size

      - name: Package publishability (publint)
        run: pnpm --filter @pibytelabs/listkit check:publish

      - name: Type emission correctness (attw)
        run: pnpm --filter @pibytelabs/listkit check:types
