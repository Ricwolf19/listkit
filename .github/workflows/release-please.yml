name: Release Please

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release PR / tag
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      # Opens/updates a "release" PR that bumps the version and writes the
      # CHANGELOG from conventional commits. Merging that PR tags the commit
      # and creates the GitHub Release; only then does `releases_created` flip
      # to true and the publish job below runs.
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish to Verdaccio
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-repo
        with:
          cache: false

      - name: Build
        run: pnpm build:all

      - name: Configure Verdaccio auth
        run: |
          echo "@pibytelabs:registry=https://registry.alagrandelepusecuca.mx/" > ~/.npmrc
          echo "//registry.alagrandelepusecuca.mx/:_authToken=\${NODE_AUTH_TOKEN}" >> ~/.npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to Verdaccio
        run: |
          VERSION=$(jq -r '.version' packages/listkit/package.json)
          if npm view @pibytelabs/listkit@"$VERSION" version > /dev/null 2>&1; then
            echo "Version $VERSION already published. Skipping publish."
          else
            cd packages/listkit && npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
