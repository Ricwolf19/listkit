name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish to Verdaccio
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/setup-repo
        with:
          cache: false

      - name: Check for pending changesets
        id: changesets
        run: |
          if pnpm exec changeset status > /dev/null 2>&1; then
            echo "has_changesets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changesets=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Verdaccio auth
        run: |
          echo "@pibytelabs:registry=https://registry.alagrandelepusecuca.mx/" > ~/.npmrc
          echo "//registry.alagrandelepusecuca.mx/:_authToken=\${NODE_AUTH_TOKEN}" >> ~/.npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Version, Build and Publish
        if: steps.changesets.outputs.has_changesets == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # 1. Bump version + generate changelog + consume changesets
          pnpm exec changeset version

          # 2. Build with bumped version
          pnpm build:all

          # 3. Publish to registry
          pnpm exec changeset publish

          # 4. Commit version bump and push back to main
          #    [skip ci] prevents infinite workflow loops
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "chore: release [skip ci]"
          git push origin main
