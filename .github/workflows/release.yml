name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish to Verdaccio
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-repo
        with:
          cache: false

      - name: Build
        run: pnpm build:all

      - name: Configure Verdaccio auth
        run: |
          echo "@pibytelabs:registry=https://registry.alagrandelepusecuca.mx/" > ~/.npmrc
          echo "//registry.alagrandelepusecuca.mx/:_authToken=\${NODE_AUTH_TOKEN}" >> ~/.npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to Verdaccio
        run: |
          VERSION=$(jq -r '.version' packages/listkit/package.json)
          if npm view @pibytelabs/listkit@"$VERSION" version > /dev/null 2>&1; then
            echo "Version $VERSION already published. Skipping publish."
          else
            cd packages/listkit && npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create and push Git tag
        run: |
          VERSION=$(jq -r '.version' packages/listkit/package.json)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "@pibytelabs/listkit@$VERSION" -m "Release v$VERSION" || true
          git push origin "refs/tags/@pibytelabs/listkit@$VERSION" || true

      - name: Create GitHub Release
        run: |
          VERSION=$(jq -r '.version' packages/listkit/package.json)
          TAG="@pibytelabs/listkit@$VERSION"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists. Skipping."
          else
            gh release create "$TAG" --title "v$VERSION" --notes "See packages/listkit/CHANGELOG.md for details." --verify-tag
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
