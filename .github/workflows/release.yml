name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish to Verdaccio
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-repo
        with:
          cache: false

      - name: Build
        run: pnpm build:all

      - name: Configure Verdaccio auth
        run: |
          echo "@pibytelabs:registry=https://registry.alagrandelepusecuca.mx/" > ~/.npmrc
          echo "//registry.alagrandelepusecuca.mx/:_authToken=\${NODE_AUTH_TOKEN}" >> ~/.npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Publish with npm (not pnpm/changeset): npm attaches the `readme` field to
      # the registry manifest, which is what Verdaccio's web UI renders. Skips
      # versions already on the registry so the workflow stays green on no-op pushes.
      - name: Publish to Verdaccio and tag
        run: |
          cd packages/listkit
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          TAG="$NAME@$VERSION"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$TAG already published — skipping publish & tag."
            exit 0
          fi
          npm publish
          cd "$GITHUB_WORKSPACE"
          git tag "$TAG"
          git push origin "$TAG" || true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
